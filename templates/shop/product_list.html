{% extends "base.html" %}

{% block title %}Shop thrift dresses - GHthrift{% endblock %}

{% block content %}
{% load static %}
<section class="section-tight">
  <div class="container">
    <form class="shop-search" method="get" action="{% url 'shop:product_list' %}"
          hx-get="{% url 'shop:product_list' %}" hx-target="#product-results" hx-swap="outerHTML"
          hx-trigger="submit, keyup changed delay:350ms from:input[name='q']"
          hx-push-url="true" hx-indicator="#filter-loading">
      {% for field in form %}
        {% if field.name != "q" and field.value %}
          {{ field.as_hidden }}
        {% endif %}
      {% endfor %}

      <div class="grid" aria-hidden="true"></div>

      <div id="poda">
        <div class="glow" aria-hidden="true"></div>
        <div class="darkBorderBg" aria-hidden="true"></div>
        <div class="darkBorderBg" aria-hidden="true"></div>
        <div class="darkBorderBg" aria-hidden="true"></div>
        <div class="white" aria-hidden="true"></div>
