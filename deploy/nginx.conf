# /etc/nginx/sites-available/ghthrift
# Replace ghthrift.com with your domain. Run certbot afterwards to add TLS.
#
#   sudo ln -s /etc/nginx/sites-available/ghthrift /etc/nginx/sites-enabled/ghthrift
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ghthrift.com -d www.ghthrift.com

upstream ghthrift_app {
    server unix:/run/ghthrift/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ghthrift.com www.ghthrift.com;

    client_max_body_size 20M;

    access_log /var/log/nginx/ghthrift-access.log;
    error_log  /var/log/nginx/ghthrift-error.log;

    location /static/ {
        alias /var/www/ghthrift/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/ghthrift/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://ghthrift_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
