upstream ghthrift_app {
    server unix:/run/ghthrift/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ghthrift.com www.ghthrift.com;

    client_max_body_size 20M;

    access_log /var/log/nginx/ghthrift-access.log;
    error_log  /var/log/nginx/ghthrift-error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /static/ {
        alias /var/www/ghthrift/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/ghthrift/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        return 301 https://ghthrift.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ghthrift.com;

    ssl_certificate /etc/letsencrypt/live/ghthrift.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghthrift.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    access_log /var/log/nginx/ghthrift-access.log;
    error_log  /var/log/nginx/ghthrift-error.log;

    location /static/ {
        alias /var/www/ghthrift/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/ghthrift/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://ghthrift_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}
