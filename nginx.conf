events {
    worker_connections 1024;
}
http {
    sendfile on;
    types_hash_max_size 2048;

    # MIME type mappings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml-rss application/atom+xml;

    # Static files (Whitenoise)
    server {
        listen 80;
        root /app/staticfiles;

        # Serve static files with far-future expiration for caching
        location /static {
            alias /app/staticfiles;
            add_header Cache-Control "max-age=31536000, public";
        }

        # Media files (user uploaded content)
        location /media {
            alias /media;
            add_header Cache-Control "max-age=86400";
        }
    }

    # Application server (Gunicorn)
    upstream ghthrift {
        server web:8000;
    }

    server {
        listen 80;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;

        # Serve from upstream gunicorn
        location / {
            proxy_pass_header Authorization;
            proxy_pass http://ghthrift;
        }

        # Media files when not using R2/S3
        location /media {
            alias /media;
        }

        # Static files
        location /static {
            alias /staticfiles;
        }

        # Health check
        location /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}